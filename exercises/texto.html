<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texto — Spanish Despacio</title>
  <meta name="description" content="Ejercicio interactivo: completa los espacios en blanco de un texto en español.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  <div id="site-header-placeholder"></div>

  <main id="main-content">
    <section class="intro-band">
      <div class="container">
        <a class="back-link-top" href="/exercises.html" aria-label="Volver a Ejercicios">&larr;</a>
        <h1>Texto</h1>
        <p>Elige una categoría y un nivel de dificultad, y completa los espacios en blanco del texto. Todas las formas verbales de este ejercicio son en modo indicativo. Cuando termines, pulsa "Comprobar".</p>
        <div id="variant-switcher-slot"></div>
      </div>
    </section>

    <div class="container">
      <div id="exercise-type-slot"></div>
      <div id="series-switcher-slot"></div>
      <div id="exercise-app">
        <p>Cargando ejercicio…</p>
      </div>
      <a class="back-link-bottom" href="/exercises.html">&larr; Ejercicios</a>
    </div>
  </main>

  <div id="site-footer-placeholder"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="/js/exercise-common.js"></script>
  <script src="/js/exercise-texto.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      ExerciseCommon.initExerciseTypePage([
        { id: 'facil', label: 'Fácil', engine: 'textoFacil', srcTemplate: '/content/exercises/texto-{type}.csv' },
        { id: 'dificil', label: 'Difícil', engine: 'textoDificil', srcTemplate: '/content/exercises/texto-{type}.csv' },
      ], { variants: ['articulos', 'adjetivos', 'verbos'] });
    });
  </script>
</body>
</html>
